name: CI/CD Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# Trigger: solo cuando se hace push sobre una rama que tiene PR abierta → main
# ─────────────────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches:
      - main

# Evita ejecuciones redundantes si se hace push rápido sobre la misma rama/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  WORKING_DIR: ./backend
  # Fuerza a las GitHub Actions a usar Node 24 internamente para evitar el warning de deprecación de Node 20
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 – Tests
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Cache automático de npm usando package-lock.json del backend
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ env.WORKING_DIR }}
        run: npm test
        env:
          # ts-jest no necesita BD real; si los tests requieren DB, añadir un
          # service de postgres aquí y pasar DATABASE_URL
          CI: true

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 – Build (TypeScript → dist/)
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: test           # Solo se ejecuta si los tests pasan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Build TypeScript (tsc → dist/)
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run build

      # Empaqueta solo lo necesario para producción:
      # dist/ + package.json + package-lock.json (para npm ci en EC2)
      - name: Package build artifact
        run: |
          tar -czf build.tar.gz \
            backend/dist \
            backend/package.json \
            backend/package-lock.json \
            backend/prisma

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: build.tar.gz
          retention-days: 1     # Solo necesario para el job de deploy

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 – Deploy a AWS EC2 vía SSH
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: build          # Solo se ejecuta si el build tiene éxito

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build

      # Configura la clave SSH desde el secret y añade el host a known_hosts
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.AWS_EC2_HOST }} >> ~/.ssh/known_hosts

      # Transfiere el tarball al servidor
      - name: Transfer build to EC2
        run: |
          scp -i ~/.ssh/deploy_key \
            build.tar.gz \
            ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }}:~/build.tar.gz

      # Descomprime, instala solo deps de producción y reinicia con PM2
      - name: Deploy & restart service
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} << 'EOF'
            set -e

            # Descomprimir en el directorio de la app
            mkdir -p ~/app
            tar -xzf ~/build.tar.gz -C ~/app --strip-components=1
            rm ~/build.tar.gz

            # Instalar solo dependencias de producción
            cd ~/app
            npm ci --omit=dev

            # Generar cliente de Prisma en servidor
            npx prisma generate

            # Reiniciar con PM2 (o arrancar si no existe el proceso)
            pm2 restart backend || pm2 start dist/index.js --name backend

            # Guardar configuración PM2 para reinicios del sistema
            pm2 save
          EOF
